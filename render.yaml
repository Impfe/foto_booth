# Betrieb ohne eigenen Rechner: Diese Datei beschreibt Render den kompletten
# Dienst. Im Render-Dashboard "New > Blueprint" waehlen, dieses Repository
# angeben - der Rest passiert von selbst.
#
# Wichtig ist die Platte weiter unten. Ohne sie waeren alle Fotos beim naechsten
# Neustart weg, denn das Dateisystem eines Dienstes ist sonst fluechtig.
services:
  - type: web
    name: fotobox
    runtime: node
    region: frankfurt
    plan: starter # Der Gratis-Tarif kann keine Platte und schlaeft ein.
    buildCommand: npm ci --omit=dev
    # Bewusst nicht "npm start": Das npm-Skript laedt zusaetzlich eine .env und
    # braucht dafuer eine Node-Option, die aeltere Fassungen nicht kennen. Hier
    # gibt es keine .env - die Einstellungen kommen aus dem Dashboard.
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      # Muss auf die Platte unten zeigen, sonst sind die Fotos nach jedem
      # Neustart weg.
      - key: DATA_DIR
        value: /var/data
    disk:
      name: fotos
      mountPath: /var/data
      sizeGB: 1
